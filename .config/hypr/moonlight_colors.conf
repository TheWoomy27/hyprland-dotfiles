Backgrounds & Surfaces
These form the foundational layers of the theme, ranging from the deepest shadows to highlighted selections.

    #131421 
    Deepest background (Used for isolated elements like checkboxes)

    #191a2a 
    Dark background (Inputs, hover widgets, borders, and drop-downs)

    #1e2030 
    Secondary background (Sidebar, terminal, panels, and activity bar)

    #222436 
    Primary background (Main editor canvas and tabs)

    #2f334d 
    Elevated background (Active selections, line highlights, and notifications)


Foregrounds & Text
These dictate the readability and hierarchy of standard text outside of code syntax.

    #ffffff 
    Pure white (Active list selections, prominent buttons, and error text)

    #d5def8 
    Terminal default foreground

    #c8d3f5 
    Primary foreground (Main editor text, standard variables, and active tabs)

    #b4c2f0 
    Muted foreground (Activity bar and markup tables)

    #828bb8 
    Inactive foreground (Comments, line numbers, inactive tabs, and breadcrumbs)

    #444a73 
    Low-contrast foreground (Editor rulers, indent guides, and find match backgrounds)


Syntax & Semantic Palette
These are the core colors that give the theme its identity, mapped to specific coding languages and logic structures.

    Blues & Cyans

        #7cafff 
        Core Functions, special methods, and JSON top-level keys

        #60bdff 
        Default library functions, general methods, and text links

        #78dbff 
        Operators, control flow keywords, and escape characters

        #b4f9f8 
        Readonly properties, CSS values, and regular expressions

        #a9b8e8 
        Standard properties, blockquotes, and fenced language definitions

    Purples

        #af9fff 
        Core keywords, storage modifiers, and raw markup blocks

        #7a88cf 
        Comments and punctuation definitions

    Pinks & Reds

        #ff757f 
        Self parameters, HTML tags, constant characters, and bold/italic markup

        #ff5370 
        Invalid code, deleted git markers, and editor errors

        #fca7ea 
        Function arguments, CSS keyframes, RegExp quantifiers, and JSON Level 2 keys

        #ff98a4 
        Language constants, CSS units, and embedded elements

        #fd8aca 
        JSX Components

        #fc7b7b 
        CSS specific units

    Oranges & Yellows

        #ffc777 
        Classes, default variables, PHP constants, DOM elements, and git warnings

        #ff966c 
        Numbers, built-in classes, and entity types

        #f8b576 
        General attributes and HTML attributes

    Greens

        #c3e88d 
        Property declarations, object literal keys, added git markers, and JSON Level 1 keys

        #7af8ca 
        Standard strings, symbols, and untracked git resources

    Greys

        #979bb6 
        Undefined and Null values

        #777fab 
        Ignored git resources


UI Accents, Git & Status Validation
Colors specifically reserved for drawing the eye to system statuses, buttons, and version control states.

    #3b63cf: Primary buttons, activity badges, and prominent extensions

    #3d6fe0: Button hover states

    #446bbb: Information validation backgrounds

    #ad7c43: Warning validation backgrounds

    #c53b53: Error validation backgrounds



