# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = JetBrains Mono
$font2 = JetBrains Mono

general {
    hide_cursor = false
    immediate_render = false
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/austin/Downloads/wallhaven-727q29.jpg
    blur_passes = 3
}

input-field {
    monitor = DP-4
    size = 20%, 5%
    outline_thickness = 5
    inner_color = rgba(23253390)

    outer_color = rgba(7cafffff) rgba(3B63CFFF) 0deg
    check_color = rgba(7cafffff) rgba(3B63CFFF) 180deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(200, 211, 245)
    fade_on_empty = false
    rounding = 99

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -180
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-4
    text = $TIME12 # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = SF Pro Display Bold

    position = 0, -220
    halign = center
    valign = top
}

# DATE
label {
    monitor = DP-4
    text = cmd[update:60000] date +"%A, %B%e %Y" # update every 60 seconds
    font_size = 28
    font_family = $font2 Bold

    position = 0, -370
    halign = center
    valign = top
}

label {
    monitor = DP-4
    text = Austin Fares
    font_size = 25
    font_family = $font Bold
    position = 0, -100
    halign = center
    valign = center
}

image {
    monitor = DP-4
    path = /home/austin/Documents/Betta_Fish_PFP.jpg
    border_color = rgba(7cafffff) rgba(3B63CFFF) 0deg
    border_size = 5
    size = 200
    position = 0, 40
    halign = center
    valign = center
}

image {
    monitor = DP-4
    path = /usr/share/pixmaps/fedora-gdm-logo.png
    border_size = 0
    size = 40
    position = -80, 22
    halign = center
    valign = bottom
    rounding = 0
}

image {
    monitor = DP-4
    path = /home/austin/.config/hypr/Hyprland.png
    border_size = 0
    size = 60
    position = 80, 10
    halign = center
    valign = bottom
}

