# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font = SF Pro Display
$font2 = JetBrains Mono

general {
    hide_cursor = false
    immediate_render = false
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 1000 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = fluent, 0.0, 0.0, 0.2, 1.0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 7, fluent
    animation = inputFieldWidth, 1, 5, fluent
}

background {
    monitor =
    path = /home/austin/Pictures/Wallpapers/current_wallpaper.jpg
    blur_passes = 3
}

###############
### DESKTOP ###
###############

input-field {
    monitor = DP-4
    size = 15%, 5%
    outline_thickness = 4
    inner_color = rgba(23253390)

    outer_color = rgba(7cafffff) rgba(3B63CFFF) 0deg
    check_color = rgba(7cafffff) rgba(3B63CFFF) 180deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(200, 211, 245)
    fade_on_empty = false
    rounding = 20

    font_family = $font2
    placeholder_text = Password
    fail_text = $PAMFAIL
    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    position = 0, -150
    halign = center
    valign = center
}

# TIME
label {
    color = rgba(255, 255, 255, 0.2)
    monitor = DP-4
    text = $TIME12 # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 95
    font_family = $font Bold

