#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

#exec-once = $terminal
#exec-once = nm-applet &
exec-once = nautilus &
exec-once = brave &
exec-once = swaync &
# exec-once = waypaper --wallpaper ~/Downloads/wallhaven-727q29.jpg &
exec-once = hyprpaper &
exec-once = hypridle &
exec-once = waybar &
exec-once = systemctl --user start hyprpolkitagent &
exec-once = hyprtoolkit &
exec-once = hyprpm reload
exec-once = flatpak run org.openrgb.OpenRGB//beta 
exec = gsettings set org.gnome.desktop.interface gtk-theme "Moonlight"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
#exec-once = ~/.config/hypr/scripts/start_betta_fish_wallpaper.sh

exec-once = discord &
exec-once = Telegram &

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets