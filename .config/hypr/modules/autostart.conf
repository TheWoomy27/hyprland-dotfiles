#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

#exec-once = $terminal
#exec-once = nm-applet &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = [workspace 1 silent] brave
exec-once = vicinae server
exec-once = swaync &
exec-once = hyprpaper &
exec-once = hypridle &
exec-once = waybar &
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprtoolkit &
exec-once = hyprpm reload
#exec-once = ~/.config/hypr/scripts/start_betta_fish_wallpaper.sh
exec-once = discord
exec-once = Telegram
exec-once = openrgb && sleep 10 && openrgb -d "MSI MAG Z690 TOMAHAWK WIFI DDR4 (MS-7D32)" -m static && sleep 2 && openrgb -d "MSI MAG Z690 TOMAHAWK WIFI DDR4 (MS-7D32)" -m direct && sleep 2 && openrgb -d "MSI MAG Z690 TOMAHAWK WIFI DDR4 (MS-7D32)" -m static
# exec = gsettings set org.gnome.desktop.interface gtk-theme "Moonlight"
# exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
# exec-once = ~/.config/hypr/scripts/start_betta_fish_wallpaper.sh

exec-once = openclaw gateway restart
exec-once = syncthing serve --no-browser

exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 &   

exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=secrets
