#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

#exec-once = $terminal
#exec-once = nm-applet &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = [workspace 1 silent] brave
exec-once = swaync &
exec-once = hyprpaper &
exec-once = hypridle &
exec-once = waybar &
exec-once = systemctl --user start hyprpolkitagent &
exec-once = hyprtoolkit &
exec-once = hyprpm reload
exec-once = flatpak run org.openrgb.OpenRGB//beta 
#exec-once = ~/.config/hypr/scripts/start_betta_fish_wallpaper.sh
exec-once = [workspace 4 silent] discord
exec-once = [workspace 4 silent] Telegram
exec-once = flatpak run org.openrgb.OpenRGB//beta 
exec-once = openrgb && openrgb -d "MSI MAG Z690 TOMAHAWK WIFI DDR4 (MS-7D32)" -m static
# exec = gsettings set org.gnome.desktop.interface gtk-theme "Moonlight"
# exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
# exec-once = ~/.config/hypr/scripts/start_betta_fish_wallpaper.sh

exec-once = openclaw gateway restart
exec-once = syncthing serve --no-browser

exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=secrets
